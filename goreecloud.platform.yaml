schema_version: "0.3"

component:
  type: application
  id: goreecloud-contacts
  product_name: GoreeCloud Contacts
  repository: GoreeCloud/goreecloud-contacts

lifecycle: development
version: "0.1.0-dev"

supported_platforms:
  - web
  - server
  - android

api:
  versions: []
  endpoints: []

platform_systems:
  manager:
    result: applicable-blocked
    version: null
    evidence:
      - README.md
      - clients/android/README.md
    notes: No accepted GoreeCloud Manager registration, lifecycle control, operational visibility, or administrative integration is established for Contacts.

  privacy_shield:
    result: applicable-blocked
    version: null
    evidence:
      - README.md
      - clients/android/README.md
      - clients/android/app/src/main/java/com/goreecloud/contacts/ContactsIdentityBinding.kt
    notes: Existing session and CardDAV boundaries minimize authority and the Android client remains network-disabled, but accepted Privacy Shield purpose, consent, retention, runtime enforcement, revocation, and production validation are not established.

  wardveil_security:
    result: applicable-blocked
    version: null
    evidence:
      - README.md
      - clients/android/README.md
      - clients/android/app/src/main/java/com/goreecloud/contacts/ContactsIdentityBinding.kt
    notes: Contacts has fail-closed identity/read-contract source boundaries and the Android shell keeps network and Contacts Provider permissions disabled, but accepted Wardveil Security runtime integration and production security evidence are not established.

  everkeep:
    result: applicable-blocked
    version: null
    evidence:
      - README.md
      - clients/android/README.md
    notes: Contact portability is grounded in CardDAV/vCard, but accepted Everkeep backup, clean-target restore, recovery lineage, failure reconciliation, and production recovery evidence are not established.

  glaze_ui:
    result: applicable-migration-required
    version: "1.4.1"
    evidence:
      - clients/android/README.md
      - clients/android/app/src/main/java/com/goreecloud/contacts/GlazeContactsTheme.kt
      - clients/android/app/src/test/java/com/goreecloud/contacts/GlazeContactsContractTest.kt
      - scripts/validate_android_glaze_v1_4.py
      - docs/glaze-ui-v1.4-android-adoption.md
    notes: The Android Development client targets current Stable GLAZE UI V1.4.1 / 1.4.1 at authoritative Stable main revision 4fab9da0fad2e5c974e0e66ec88632c61745751c, with V1.4.0 retained as the immediate rollback baseline. Shared V1.4.1 qualification does not establish Contacts-local conformance. Optical Engine, Reduced Transparency, Increased Contrast, representative-device, accessibility, performance, Human Visual Excellence, rollback, release, and production acceptance remain explicitly unaccepted.

  mesh:
    result: applicable-blocked
    version: null
    evidence:
      - README.md
      - clients/android/README.md
    notes: Contacts has no accepted GoreeCloud Mesh registration, service identity, capability publication, event transport, or runtime integration.
    capabilities: []
    dependencies: []
    published_events: []
    consumed_events: []

  identity:
    result: applicable-blocked
    version: null
    evidence:
      - clients/android/README.md
      - clients/android/app/src/main/java/com/goreecloud/contacts/ContactsIdentityBinding.kt
      - clients/android/app/src/test/java/com/goreecloud/contacts/ContactsIdentityBindingTest.kt
    notes: The Android client has a source-ready fail-closed principal/audience/lifetime acceptance contract pinned to the canonical GoreeCloud Identity native-session source contract, but no deployed native Identity registration, credential exchange, session runtime, protected credential storage, or accepted production Identity authority exists.

health:
  health_endpoint: null
  readiness_endpoint: null

continuity:
  backup:
    required: true
    requirements:
      - Define the production Contacts backup scope and preserve privacy-minimized CardDAV/vCard data plus required configuration under accepted Everkeep policy.
      - Keep GoreeCloud Sync replication distinct from backup truth and recovery evidence.
  restore:
    required: true
    requirements:
      - Validate authorized clean-target restoration against the authoritative CardDAV service without creating an application-only competing contact authority.
      - Preserve ETag/conflict semantics, Identity ownership, privacy boundaries, recovery lineage, and failure reconciliation.
  export:
    required: true
    requirements:
      - Preserve user-controlled vCard/VCF portability for supported contact fields without exporting reusable credentials or unrelated account state.
  portability:
    required: true
    requirements:
      - Preserve CardDAV/vCard interoperability and explicit migration/conflict behavior across supported clients.
      - Keep Android Contacts Provider integration optional, permission-bound, and non-authoritative.

external_dependencies:
  - name: Radicale
    purpose: Authoritative CardDAV contact service.
    required: true
    version_constraint: "CardDAV-compatible"
  - name: Android platform
    purpose: Native Android application runtime and optional Contacts Provider bridge.
    required: true
    version_constraint: ">=29"

compatibility:
  platform_contract: "0.3"
  glaze_ui_required: "1.4.1"
  requires:
    - goreecloud-platform-contract==0.3
    - glaze-ui==1.4.1
    - carddav
    - android-api>=29
  provides: []

evidence:
  acceptance_tests: []
  release: []

conformance:
  status: nonconformant
  validated_at: null
  evidence:
    - README.md
    - clients/android/README.md
    - clients/android/app/src/main/java/com/goreecloud/contacts/GlazeContactsTheme.kt
    - clients/android/app/src/main/java/com/goreecloud/contacts/ContactsIdentityBinding.kt
    - clients/android/app/src/test/java/com/goreecloud/contacts/ContactsIdentityBindingTest.kt
    - clients/android/app/src/test/java/com/goreecloud/contacts/GlazeContactsContractTest.kt
    - scripts/validate_android_glaze_v1_4.py
    - docs/glaze-ui-v1.4-android-adoption.md
  blockers:
    - GoreeCloud Manager registration and operational acceptance are not established.
    - Privacy Shield runtime integration and production privacy acceptance are not established.
    - Wardveil Security runtime integration and production security acceptance are not established.
    - Everkeep backup, clean-target restore, recovery lineage, and production recovery acceptance are not established.
    - GLAZE UI V1.4.1 source adoption is in progress; shared Stable qualification does not replace Contacts-local rendered, accessibility, adaptive/form-factor, representative-device, performance, Human Visual Excellence, rollback, release, and production acceptance.
    - GoreeCloud Mesh registration, capability publication, event transport, and runtime acceptance are not established.
    - GoreeCloud Identity native registration, credential exchange, session runtime, protected credential storage, and production acceptance are not established.
    - GoreeCloud Sync change tracking, version/conflict reconciliation, authorized replication, offline-resume, and cross-device continuity acceptance are not established.
    - Android network transport, offline cache/reconciliation, background sync, contact writes, and Contacts Provider bridge remain separately blocked Development capabilities.
    - Production signing/provenance, deployment, Release Candidate approval, and Stable qualification remain outstanding.
